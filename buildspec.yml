version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.8
    commands:
      - echo Installing mysql-client, jq, and awscli...
      - apt-get update && apt-get install -y mysql-client jq awscli

  pre_build:
    commands:
      - echo Fetching credentials from AWS Secrets Manager...
      - SECRET=$(aws secretsmanager get-secret-value --secret-id mysql-secrets_new --query SecretString --output text)
      - echo "Secret fetched"
      - MYSQL_USER=$(echo $SECRET | jq -r .username_new)
      - MYSQL_PASS=$(echo $SECRET | jq -r .password_new)
      - MYSQL_HOST=$(echo $SECRET | jq -r .host_new)
      - MYSQL_PORT=$(echo $SECRET | jq -r .port_new)

  build:
    commands:
      - echo Running query_employees.sh...
      - chmod +x query_employees.sh
      - ./query_employees.sh "$MYSQL_HOST" "$MYSQL_PORT" "$MYSQL_USER" "$MYSQL_PASS"
